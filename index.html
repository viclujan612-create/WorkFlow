<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>WorkFlow KB — Inicio</title>
<link rel="icon" type="image/svg+xml" href="Logo_KEVIRAGO.svg">

<!-- Anti-flash: pinta el fondo oscuro antes de que se cargue el resto del CSS -->
<style>
  html, body { background: #0d0d0d; color: #eaeaea; margin: 0; }
</style>

<style>
  :root {
    --brand: #ff2a00;
    --brand-hover: #e02500;
    --ink: #eaeaea;
    --line: #2a2a2a;
    --radius: 12px;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: #0d0d0d; }
  body {
    margin: 0; min-height: 100vh;
    padding: clamp(20px, 5vw, 60px) clamp(14px, 4vw, 30px);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    background: #0d0d0d; color: var(--ink);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px; line-height: 1.45;
  }

  /* ====== TARJETA CENTRAL ====== */
  .home-card {
    width: 100%; max-width: 720px;
    padding: clamp(30px, 6vw, 55px) clamp(22px, 5vw, 50px);
    background: #161616; color: var(--ink);
    border: 1px solid var(--line); border-top: 6px solid var(--brand);
    border-radius: var(--radius);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .55);
    text-align: center;
    animation: fadeIn .5s ease both;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ====== LOGO ====== */
  .logo-wrap {
    display: flex; justify-content: center; align-items: center;
    margin-bottom: clamp(20px, 4vw, 32px);
  }
  .brand-logo {
    display: block;
    height: clamp(48px, 9vw, 66px);
    width: auto; max-width: 100%;
  }
  .brand-logo .st0 { fill: #f0f0f0; }
  .brand-logo .st1 { fill: var(--brand); }

  /* ====== TÍTULO ====== */
  .home-title {
    margin: 0 0 8px;
    font-size: clamp(22px, 4.5vw, 32px);
    font-weight: 800;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #f0f0f0;
  }
  .home-title .accent { color: var(--brand); }

  .home-subtitle {
    margin: 0 auto clamp(30px, 5vw, 44px);
    max-width: 460px;
    font-size: clamp(12.5px, 1.5vw, 14px);
    line-height: 1.6;
    color: #999;
  }

  /* ====== BOTONES CUADRADOS ====== */
  .menu-grid {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(14px, 2.5vw, 22px);
  }
  .menu-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
    width: clamp(150px, 40vw, 190px);
    aspect-ratio: 1 / 1;
    padding: 18px;
    text-decoration: none;
    background: #1a1a1a; color: #eaeaea;
    border: 2px solid transparent; border-radius: 14px;
    font-family: inherit; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
    transition: transform .25s ease, background .25s, border-color .25s,
                box-shadow .25s, color .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .menu-tile:hover {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(255, 42, 0, .35);
  }
  .menu-tile:active { transform: translateY(-1px); }

  .menu-tile .tile-icon {
    font-size: clamp(30px, 6vw, 40px);
    line-height: 1;
    pointer-events: none;
  }
  .menu-tile .tile-label {
    font-size: clamp(13px, 1.7vw, 15px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    pointer-events: none;
  }
  .menu-tile .tile-hint {
    font-size: 10.5px;
    font-weight: 600;
    opacity: .65;
    letter-spacing: .4px;
    pointer-events: none;
  }

  /* ====== PIE ====== */
  .home-footer {
    margin-top: clamp(28px, 5vw, 40px);
    padding-top: 18px;
    border-top: 1px dashed #2a2a2a;
    font-size: 12px; color: #888;
  }
  .home-footer strong { color: var(--brand); }
</style>
</head>
